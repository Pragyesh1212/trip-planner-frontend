<div class="min-h-screen bg-white flex items-center justify-center px-4 py-12">

  <div class="w-full max-w-md">

    <!-- Branding -->
    <div class="text-center mb-8">

      <a
        routerLink="/"
        class="text-2xl font-bold text-blue-600">

        Trip Planner

      </a>

      <h1 class="mt-5 text-3xl font-bold text-black">

        Create Your Account

      </h1>

      <p class="mt-2 text-slate-500">

        Create an account to start planning your journeys.

      </p>

    </div>


    <!-- Signup Card -->
    <div
      class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">

      <form
        (ngSubmit)="signup()">


        <!-- Error Message -->
        @if (errorMessage) {

          <div
            class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3">

            <p class="text-sm font-medium text-red-700">

              {{ errorMessage }}

            </p>

          </div>

        }


        <!-- Success Message -->
        @if (successMessage) {

          <div
            class="mb-5 rounded-xl border border-green-200 bg-green-50 px-4 py-3">

            <p class="text-sm font-medium text-green-700">

              {{ successMessage }}

            </p>

          </div>

        }


        <!-- Name -->
        <div class="mb-5">

          <label
            for="name"
            class="block text-sm font-medium text-slate-700 mb-2">

            Name

          </label>

          <input
            id="name"
            type="text"
            name="name"
            [(ngModel)]="name"
            placeholder="Enter your name"
            autocomplete="name"
            required
            class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />

        </div>


        <!-- Email -->
        <div class="mb-5">

          <label
            for="email"
            class="block text-sm font-medium text-slate-700 mb-2">

            Email

          </label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
            class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />

        </div>


        <!-- Password -->
        <div class="mb-5">

          <label
            for="password"
            class="block text-sm font-medium text-slate-700 mb-2">

            Password

          </label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Create a password"
            autocomplete="new-password"
            required
            class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />

        </div>


        <!-- Create Account Button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition">

          {{ isLoading ? 'Creating account...' : 'Create Account' }}

        </button>

      </form>


      <!-- Login Link -->
      <div class="mt-6 text-center">

        <p class="text-sm text-slate-500">

          Already have an account?

          <a
            routerLink="/login"
            class="text-blue-600 font-semibold hover:text-blue-700">

            Login

          </a>

        </p>

      </div>

    </div>


    <!-- Back to Home -->
    <div class="text-center mt-6">

      <a
        routerLink="/"
        class="text-sm text-slate-500 hover:text-blue-600">

        ← Back to Home

      </a>

    </div>

  </div>

</div>
