<div
  class="min-h-screen bg-white flex items-center justify-center px-4 py-8"
>

  <div
    class="w-full max-w-md"
  >

    <!-- Logo / Title -->

    <div
      class="text-center mb-8"
    >

      <h1
        class="text-3xl font-bold text-slate-900"
      >
        Trip Planner
      </h1>

      <p
        class="mt-2 text-sm text-slate-500"
      >
        Create a new password
      </p>

    </div>


    <!-- Reset Password Card -->

    <div
      class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8"
    >

      <div
        class="mb-6"
      >

        <h2
          class="text-2xl font-bold text-slate-900"
        >
          Reset Password
        </h2>

        <p
          class="mt-2 text-sm leading-6 text-slate-500"
        >
          Enter a new password for your account.
        </p>

        @if (email) {

          <p
            class="mt-2 text-sm font-medium text-slate-700"
          >
            {{ email }}
          </p>

        }

      </div>


      <!-- Success Message -->

      @if (successMessage) {

        <div
          class="mb-5 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700"
        >

          {{ successMessage }}

        </div>

      }


      <!-- Error Message -->

      @if (errorMessage) {

        <div
          class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600"
        >

          {{ errorMessage }}

        </div>

      }


      <!-- Reset Password Form -->

      <form
        (ngSubmit)="resetPassword()"
      >

        <!-- New Password -->

        <div
          class="mb-5"
        >

          <label
            for="newPassword"
            class="mb-2 block text-sm font-medium text-slate-700"
          >
            New Password
          </label>


          <input
            id="newPassword"
            name="newPassword"
            type="password"
            [(ngModel)]="newPassword"
            placeholder="Enter new password"
            autocomplete="new-password"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />

        </div>


        <!-- Confirm Password -->

        <div
          class="mb-6"
        >

          <label
            for="confirmPassword"
            class="mb-2 block text-sm font-medium text-slate-700"
          >
            Confirm Password
          </label>


          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />

        </div>


        <!-- Reset Button -->

        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
        >

          @if (isLoading) {

            Updating Password...

          }
          @else {

            Update Password

          }

        </button>

      </form>


      <!-- Back to Login -->

      <div
        class="mt-6 text-center"
      >

        <button
          type="button"
          (click)="goToLogin()"
          class="text-sm font-medium text-blue-600 transition hover:text-blue-700"
        >
          ← Back to Login
        </button>

      </div>

    </div>


    <!-- Footer -->

    <p
      class="mt-6 text-center text-xs text-slate-400"
    >
      Keep your password secure and never share it with others.
    </p>

  </div>

</div>
