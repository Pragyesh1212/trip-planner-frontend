<div
  class="min-h-screen bg-white flex items-center justify-center px-4 py-8"
>

  <div
    class="w-full max-w-md"
  >

    <!-- Logo / Title -->

    <div
      class="text-center mb-8"
    >

      <h1
        class="text-3xl font-bold text-slate-900"
      >
        Trip Planner
      </h1>

      <p
        class="mt-2 text-sm text-slate-500"
      >
        Your AI-powered travel planning assistant
      </p>

    </div>


    <!-- Login Card -->

    <div
      class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8"
    >

      <div
        class="mb-6"
      >

        <h2
          class="text-2xl font-bold text-slate-900"
        >
          Welcome Back
        </h2>

        <p
          class="mt-2 text-sm text-slate-500"
        >
          Sign in to continue planning your trips.
        </p>

      </div>


      <!-- Error Message -->

      @if (errorMessage) {

        <div
          class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600"
        >

          {{ errorMessage }}

        </div>

      }


      <!-- Login Form -->

      <form
        (ngSubmit)="login()"
      >

        <!-- Email -->

        <div
          class="mb-5"
        >

          <label
            for="email"
            class="mb-2 block text-sm font-medium text-slate-700"
          >
            Email Address
          </label>


          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />

        </div>


        <!-- Password -->

        <div>

          <label
            for="password"
            class="mb-2 block text-sm font-medium text-slate-700"
          >
            Password
          </label>


          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />


          <!-- Forgot Password -->

          <div
            class="mt-2 text-right"
          >

            <a
              routerLink="/forgot-password"
              class="text-sm font-medium text-blue-600 transition hover:text-blue-700"
            >
              Forgot Password?
            </a>

          </div>

        </div>


        <!-- Login Button -->

        <button
          type="submit"
          [disabled]="isLoading"
          class="mt-6 w-full rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
        >

          @if (isLoading) {

            Signing In...

          }
          @else {

            Sign In

          }

        </button>

      </form>


      <!-- Signup -->

      <div
        class="mt-6 text-center"
      >

        <p
          class="text-sm text-slate-500"
        >

          Don't have an account?

          <a
            routerLink="/signup"
            class="font-medium text-blue-600 transition hover:text-blue-700"
          >
            Create Account
          </a>

        </p>

      </div>

    </div>


    <!-- Footer -->

    <p
      class="mt-6 text-center text-xs text-slate-400"
    >
      Securely manage your travel plans with Trip Planner.
    </p>

  </div>

</div>
